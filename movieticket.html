<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking Form</title>
    <style>
        body {
            display: flex;
            
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #3b63e6;
            background-image: url("https://img.magnific.com/free-vector/movie-film-strip-blue-background_1017-33458.jpg");
            
            background-size: cover;
        }
        label{
            
            font-size: larger;
        }

        h1{
            text-align: center;
        
        }

        .card{
            
            width: 25%;
            height: 60%;
            border-radius: 20px;
            padding: 20px;

        }
        button{
            display: block;
            height: 30px;
            width: 130px;
            margin: 10px auto;
            background-color: white;
            color: black;
        }
        
        :root {
            --primary: #38bdf8;    /* Frozen Sky Blue */
            --secondary: #818cf8;  /* Royal Periwinkle */
            --accent: #f43f5e;     /* Crimson Rose Accent */
            --dark-bg: #090d16;    /* Deep Obsidian Dusk */
            --card-bg: rgba(15, 23, 42, 0.5);
        }

        * { font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--dark-bg);
            color: #f8fafc;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-heading {
            font-family: 'Outfit', sans-serif;
        }
        .font-playfair { font-family: 'Playfair Display', serif; }

        /* Cyber Ambient Backdrop */
        .ambient-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(129, 140, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(244, 63, 94, 0.05) 0px, transparent 50%);
            filter: blur(40px);
        }

        /* Glassmorphism Panel Definitions */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .glass-card {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.4) 0%, rgba(9, 13, 22, 0.7) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 20px 40px -15px rgba(56, 189, 248, 0.15);
        }

        .streak-cell {
            aspect-ratio: 1;
            border-radius: 2px;
            transition: all 0.2s ease;
        }
        .streak-cell:hover {
            transform: scale(1.3);
            z-index: 10;
        }

        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        /* Premium Animation Timelines for Hero Reveal Layer */
        @keyframes heroReveal { 
            0% { opacity: 0; transform: translateY(28px); filter: blur(12px); } 
            100% { opacity: 1; transform: translateY(0); filter: blur(0); } 
        }
        @keyframes heroFadeUp { 
            0% { opacity: 0; transform: translateY(20px); } 
            100% { opacity: 1; transform: translateY(0); } 
        }
        @keyframes heroZoom { 
            0% { transform: scale(1.12); } 
            100% { transform: scale(1); } 
        }

        .hero-anim { opacity: 0; animation-fill-mode: forwards; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-reveal { animation-name: heroReveal; animation-duration: 1.1s; }
        .hero-fade { animation-name: heroFadeUp; animation-duration: 1s; }
        .hero-zoom { animation: heroZoom 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Custom Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark-bg); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

    </style>

</head>

<body> 
    <div id="baseImageLayer" class="absolute inset-0 bg-center bg-cover bg-no-repeat z-10 hero-zoom"></div>

        <div id="revealImageLayer" class="absolute inset-0 bg-center bg-cover bg-no-repeat z-30 pointer-events-none"></div>

        <canvas id="maskBufferCanvas" style="display: none;" class="absolute inset-0 pointer-events-none"></canvas>

 
    
    <div class="form-box"></div>
    
    <div class="card">
        <h1 style="color: white;">Movie Ticket Booking</h1>
        <form action="">
            <div>
                <label for="" style="color: white;"">Full Name</label>
                <input type="text" placeholder="Enter your full name" required>
            </div>
            <br>
            <div>
                <label for="" style="color: white;">Email</label>
                <input type="email" placeholder="Enter your email" required>
            </div>
            <br>
            <div>
                <label for="" style="color: white;">Select Movie</label>
                <select required>
                    <option>Choose Movie</option>
                    <option>DHOOM</option>
                    <option>PUSHPA</option>
                    <option>RAONE</option>
                    <option>KRISH</option>
                </select>
            </div>
            <br>
            <div>
                <label for="" style="color: white;">Date</label>
                <input type="date">
            </div>
            <br>
            <div>
                <label for="" style="color: white;">Time</label>
                <select required>
                    <option>10:00AM</option>
                    <option>01:00PM</option>
                    <option>02:35PM</option>
                    <option>05:25PM</option>
                    <option>08:00PM</option>
                    <option>10:45PM</option>
                </select>
            </div>
            <br>
            <div>
                <label for="" style="color: white;">Number of Tickets</label>
                <input type="number" min="1" max="10">
            </div>

            <br>
            <button type="submit">Book Now</button>
        </form>
    </div>

</body>

</html>
